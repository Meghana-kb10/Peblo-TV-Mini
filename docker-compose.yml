services:
  # ----------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: peblo-tv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-peblo_tv}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------
  # FastAPI Backend API Service
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: peblo-tv-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-peblo_tv}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /app/storage
      REFERENCE_PATH: /app/reference.json
      SEED_PATH: /app/seed_shows.json
      SECRET_KEY: ${SECRET_KEY:-peblo-super-secret-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------
  # Internal CMS (React + Vite + Nginx)
  # ----------------------------------------------------
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: peblo-tv-cms
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # ----------------------------------------------------
  # Viewer Browse UI (React + Vite + Nginx)
  # ----------------------------------------------------
  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    container_name: peblo-tv-viewer
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
    driver: local
  storage_data:
    driver: local
